# Railway deployment configuration — https://docs.railway.app/reference/config-as-code

[build]
# Use the project Dockerfile for the build (not Nixpacks auto-detect)
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Command executed when the container starts
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

# Railway will GET this path to determine if the deployment is healthy.
# Must return HTTP 200 within healthcheckTimeout seconds.
healthcheckPath = "/health"
healthcheckTimeout = 30

# Restart policy: restart the service on non-zero exit codes (crashes).
# Does NOT restart on successful exits (e.g. one-off scripts).
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
